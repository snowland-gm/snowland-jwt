[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowland-jwt"
version = "0.1.0"
description = "National-cryptography (guomi) JWT implementation based on PyJWT and snowland-smx (SM2/SM3)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "A.Star" }]
keywords = ["jwt", "guomi", "sm2", "sm3", "gm/t", "national-cryptography", "pysmx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyjwt>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# National-cryptography backends (install at least one).
smx = ["snowland-smx>=1.1.0"]
gmssl = ["gmssl-pyx>=2.1.0"]

[project.urls]
Homepage = "https://github.com/snowland-gm/snowland-jwt"
Repository = "https://github.com/snowland-gm/snowland-jwt"

[tool.setuptools.packages.find]
include = ["snowland_jwt*"]

[tool.setuptools.package-data]
snowland_jwt = []
