name: Release

# Build and publish to PyPI (via Trusted Publishing / OIDC) whenever a GitHub
# Release is published.
#
# One-time setup (no token needed, PyPI Trusted Publishing / OIDC):
#   On PyPI, open the project's management page, then:
#     Manage  ->  Publishing  ->  Add a new publisher
#   Fill in:
#     PyPI project name: snowland-jwt
#     Workflow name:     release.yml
#     Environment name:  pypi
#   If the project has never been published yet, pre-register the name first
#   via "Create project" on https://pypi.org/manage/projects/ by choosing
#   Trusted Publishing (GitHub); then configure the publisher under
#   Manage -> Publishing.
#   (Optionally add the same for TestPyPI with environment "testpypi".)

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for OIDC / Trusted Publishing

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
